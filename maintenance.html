<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQUAWK — Bakım</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
.container { text-align: center; max-width: 440px; padding: 2rem; }
h1 { color: #fff; font-size: 20px; font-weight: 500; margin: 0 0 12px; }
p { color: #64748b; font-size: 14px; line-height: 1.7; margin: 0 0 2rem; }
.dots { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 2rem; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; animation: pulse 1.4s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
.footer { border-top: 0.5px solid #1e293b; padding-top: 1.5rem; }
.footer p { color: #334155; font-size: 11px; letter-spacing: 2px; margin: 0; }
@keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }
</style>
</head>
<body>
<div class="container">
  <svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:1rem;">
    <line x1="0" y1="40" x2="55" y2="40" stroke="#1e3a5f" stroke-width="1.5"/>
    <line x1="55" y1="40" x2="85" y2="18" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="85" y1="18" x2="130" y2="18" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3"/>
    <g transform="translate(82,18) rotate(-20)">
      <path d="M0,0 L8,-3 L6,0 L8,3 Z" fill="#3b82f6"/>
      <path d="M2,-1 L6,-5 L7,-4 L4,0 Z" fill="#3b82f6"/>
      <path d="M2,1 L6,5 L7,4 L4,0 Z" fill="#3b82f6"/>
    </g>
    <text x="160" y="24" font-family="system-ui" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="3">SQUAWK</text>
    <line x1="190" y1="18" x2="235" y2="18" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="235" y1="18" x2="265" y2="40" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="265" y1="40" x2="320" y2="40" stroke="#1e3a5f" stroke-width="1.5"/>
    <g transform="translate(238,18) rotate(20)">
      <path d="M0,0 L8,-3 L6,0 L8,3 Z" fill="#3b82f6"/>
      <path d="M2,-1 L6,-5 L7,-4 L4,0 Z" fill="#3b82f6"/>
      <path d="M2,1 L6,5 L7,4 L4,0 Z" fill="#3b82f6"/>
    </g>
    <text x="160" y="48" font-family="system-ui" font-size="9" fill="#3b82f6" text-anchor="middle" letter-spacing="5">A L P H A</text>
  </svg>
  <h1>Bakım çalışması devam ediyor</h1>
  <p>Sistemimizi daha iyi hizmet verebilmek için güncelliyoruz.<br>Kısa süre içinde tekrar hizmetinizdeyiz.</p>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="footer"><p>ATC EKİP YÖNETİM MERKEZİ</p></div>
</div>
</body>
</html>
